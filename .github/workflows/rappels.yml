# =====================================================================
#  WASSIM COIFF — Robot des rappels (notifications push)
#  ---------------------------------------------------------------------
#  GitHub lance ce robot toutes les 15 minutes, gratuitement (dépôt public).
#  Il envoie :
#    • aux clients : rappel la veille (18h–22h) et ~1 h avant le rendez-vous
#    • à l'admin   : récapitulatif le matin (aujourd'hui) et le soir (demain),
#                    + chaque action d'un client et le bouton « test »
#                    (si les Cloud Functions ne l'ont pas déjà fait en direct)
#  Même si personne n'a l'application ouverte.
#
#  À faire UNE SEULE FOIS : déposer la clé de service Firebase dans
#    Settings → Secrets and variables → Actions → New repository secret
#    Nom : FIREBASE_SERVICE_ACCOUNT   Valeur : tout le contenu du fichier .json
#
#  Tester tout de suite : onglet Actions → « Rappels push » → Run workflow.
#  (GitHub peut retarder les exécutions planifiées de quelques minutes.)
# =====================================================================
name: Rappels push (rendez-vous)

on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # toutes les 15 minutes
  workflow_dispatch:                # bouton « Run workflow » pour tester

# Deux exécutions ne se chevauchent jamais.
concurrency:
  group: rappels-push
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  envoyer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-rappels-${{ hashFiles('scripts/package.json') }}

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install --omit=dev --no-audit --no-fund

      - name: Envoyer les rappels
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node envoyer-rappels.mjs
